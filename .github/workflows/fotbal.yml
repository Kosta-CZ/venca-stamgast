# Fotbalová 1. liga: v pondělí ráno vyrobí příspěvek z posledního odehraného kola (výsledky, střelci, špička
# tabulky) a pošle ho ke schválení do Telegramu (✅ Vydat / 🗑 Zahodit, vydává vydat.yml). Nikdy nevychází sám.
# V příspěvcích je soutěž „1. liga“: oficiální název nese jméno sázkové kanceláře.
#
# Výsledky z TheSportsDB (liga 4631), kola v R2 (liga/<sezóna>/), tabulka z výsledků (3-1-0). Střelce dohledá
# Claude API v českých zdrojích a kód je porovná se skóre. Když se kolo ještě dohrává (zápas v pondělí),
# počká se na úterý.
#
# Ruční spuštění: Run workflow, volitelně číslo kola (prázdné = poslední odehrané).

name: Fotbalová liga

on:
  # Plán spouští bot venca-bot (rozvrh PLAN ve worker/src/index.ts) se vstupem plan; on: schedule se tu
  # nespouštěl. Časy:
  # # Pondělí 6:53 UTC (7:53 v zimě): kolo musí být celé dohrané a výsledky v datech.
  # - cron: '53 6 * * 1'
  # # Úterý 6:53 UTC: když v pondělí ráno kolo ještě nebylo kompletní, vyrobí se teď (chybějící výsledky do „pozor“).
  # - cron: '53 6 * * 2'
  workflow_dispatch:
    inputs:
      round:
        description: 'Kolo (prázdné = poslední odehrané)'
        required: false
      ai:
        description: 'Střelci a texty Vency přes Claude API'
        type: boolean
        default: true
      send:
        description: 'Poslat ke schválení (Telegram, jinak issue)'
        type: boolean
        default: true
      plan:
        description: 'Plánovaný běh (vyplňuje bot podle rozvrhu; ručně nech prázdné)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: fotbal
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAN: ${{ github.event.schedule || inputs.plan }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Výroba příspěvku
        id: make
        env:
          ANTHROPIC_API_KEY: ${{ (env.PLAN != '' || inputs.ai) && secrets.ANTHROPIC_API_KEY || '' }}
          VENCA_MODEL: ${{ vars.VENCA_MODEL }}
          ROUND: ${{ inputs.round }}
          EARLY: ${{ env.PLAN == '53 6 * * 1' }}
          SCHEDULED: ${{ env.PLAN != '' }}
        run: |
          args=()
          [ -n "$ROUND" ] && args+=(--round "$ROUND")
          # Plánovaný běh: jen kolo, které skončilo nejvýš před 3 dny (po pauze se staré kolo neposílá).
          [ "$SCHEDULED" = true ] && args+=(--skip-existing --max-age 3)
          [ "$EARLY" = true ] && args+=(--early --whole-round)
          npm run -s venca -- liga --liga fotbal "${args[@]}"

      - name: Koncept k nahlédnutí
        if: steps.make.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fotbal
          retention-days: 14
          path: |
            out/*.jpg
            out/*.html
            out/*.json

      - name: Nahrání do úložiště
        id: upload
        # Zkušební běh bez odeslání nic nenahrává: koncept zůstane jen v artefaktu běhu.
        if: steps.make.outputs.has_post == 'true' && vars.R2_PUBLIC_URL != '' && (env.PLAN != '' || inputs.send)
        run: npm run -s venca -- upload --id "${{ steps.make.outputs.id }}"

      - name: Ke schválení (Telegram / issue)
        if: steps.make.outputs.has_post == 'true' && (env.PLAN != '' || inputs.send)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ID: ${{ steps.make.outputs.id }}
          UPLOADED: ${{ steps.upload.outputs.image_url != '' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && [ "$UPLOADED" = true ]; then
            npm run -s venca -- telegram --id "$ID"
            exit 0
          fi
          title="$(npm run -s venca -- issue --id "$ID" --title)"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Issue „$title“ už je otevřené."
            exit 0
          fi
          gh label create ke-schvaleni --color F5B027 --description 'Koncept čeká na /vydat' 2>/dev/null || true
          npm run -s venca -- issue --id "$ID" > "$RUNNER_TEMP/body.md"
          gh issue create --title "$title" --label ke-schvaleni --body-file "$RUNNER_TEMP/body.md" --assignee "${{ github.repository_owner }}"

      - name: Tento týden bez nového kola
        if: (steps.make.outputs.reason == 'exists' || steps.make.outputs.reason == 'old') && env.PLAN == '53 6 * * 1'
        env:
          ROUND: ${{ steps.make.outputs.round }}
        run: |
          npm run -s venca -- notify --text "Fotbalová liga: od minulého týdne se nehrálo žádné nové kolo (poslední je ${ROUND}. kolo), dnes nic nepošlu. ⚽"

      - name: Hlášení chyby do Telegramu
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -d node_modules ] || npm ci
          npm run -s venca -- notify --text "❌ Fotbalovou ligu se nepovedlo vyrobit. Podrobnosti: $RUN_URL" || true
