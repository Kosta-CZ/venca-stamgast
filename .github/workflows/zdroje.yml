# Kontrola zdrojů dat pro extraligu, Chance Ligu a reprezentace. Jen ruční spuštění.
# API-Sports (tajemství API_SPORTS_KEY): vypisuje sportovní data a tarif, nikdy klíč ani údaje o účtu.
# TheSportsDB: volný zdroj s veřejným klíčem, bez registrace.

name: Zdroje dat (kontrola)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Který zdroj zkusit'
        type: choice
        options: [thesportsdb, api-sports, oba]
        default: thesportsdb
      season:
        description: 'API-Sports: sezóna (prázdné = aktuální; tarif Free má jen starší sezóny)'
        required: false

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TheSportsDB
        if: inputs.source != 'api-sports'
        run: node scripts/sources-free.mjs

      - name: API-Sports
        if: inputs.source != 'thesportsdb'
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SEASON: ${{ inputs.season }}
        run: node scripts/sources.mjs
